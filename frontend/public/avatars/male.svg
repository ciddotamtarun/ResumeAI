<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="skinMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD3B6" />
      <stop offset="100%" stop-color="#EBB38F" />
    </linearGradient>
    <linearGradient id="hairMale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="suitMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="shadowMale" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="120" cy="120" r="116" fill="url(#bgMale)" stroke="#FFFFFF" stroke-width="4" />

  <!-- Background Glow & Accent -->
  <circle cx="120" cy="90" r="70" fill="#4F46D8" opacity="0.15" />

  <!-- Shoulders & Suit Jacket -->
  <path d="M38 220 C38 170, 72 155, 95 150 L120 178 L145 150 C168 155, 202 170, 202 220 Z" fill="url(#suitMale)" filter="url(#shadowMale)" />

  <!-- White Shirt & Tie -->
  <path d="M102 150 L120 185 L138 150 Z" fill="#F8FAFC" />
  <!-- Tie -->
  <polygon points="116,158 124,158 126,200 120,210 114,200" fill="#4F46D8" />
  <polygon points="116,155 124,155 125,160 115,160" fill="#3730A3" />

  <!-- Lapels -->
  <path d="M95 150 L120 185 L108 185 Z" fill="#1E293B" />
  <path d="M145 150 L120 185 L132 185 Z" fill="#1E293B" />

  <!-- Neck -->
  <rect x="106" y="122" width="28" height="34" rx="4" fill="url(#skinMale)" />

  <!-- Head Base -->
  <ellipse cx="120" cy="98" rx="36" ry="42" fill="url(#skinMale)" filter="url(#shadowMale)" />

  <!-- Ears -->
  <ellipse cx="83" cy="100" rx="6" ry="11" fill="url(#skinMale)" />
  <ellipse cx="157" cy="100" rx="6" ry="11" fill="url(#skinMale)" />

  <!-- Short Professional Hair -->
  <path d="M83 88 C80 52, 160 52, 157 88 C157 74, 148 60, 120 58 C92 60, 83 74, 83 88 Z" fill="url(#hairMale)" />
  <!-- Hair top texture -->
  <path d="M86 78 C100 62, 140 60, 154 74 C148 68, 120 62, 86 78 Z" fill="#27272A" />

  <!-- Eyebrows -->
  <path d="M96 86 Q106 82 114 85" stroke="#18181B" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M126 85 Q134 82 144 86" stroke="#18181B" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Modern Tech Lead Glasses -->
  <rect x="94" y="89" width="23" height="17" rx="4" fill="none" stroke="#0F172A" stroke-width="2.5" />
  <rect x="123" y="89" width="23" height="17" rx="4" fill="none" stroke="#0F172A" stroke-width="2.5" />
  <path d="M117 95 L123 95" stroke="#0F172A" stroke-width="2.5" fill="none" />
  <path d="M86 94 L94 94" stroke="#0F172A" stroke-width="2" fill="none" />
  <path d="M146 94 L154 94" stroke="#0F172A" stroke-width="2" fill="none" />

  <!-- Eyes behind glasses -->
  <ellipse cx="105.5" cy="97" rx="4.5" ry="3.5" fill="#1C1917" />
  <ellipse cx="134.5" cy="97" rx="4.5" ry="3.5" fill="#1C1917" />
  <circle cx="107" cy="95.5" r="1.5" fill="#FFFFFF" />
  <circle cx="136" cy="95.5" r="1.5" fill="#FFFFFF" />
  <!-- Lens reflection -->
  <path d="M96 92 L106 92" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
  <path d="M125 92 L135 92" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M120 97 Q123 109 119 112" stroke="#C98F6B" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Subtle Beard / Stubble -->
  <path d="M98 122 C104 136, 136 136, 142 122 C135 132, 105 132, 98 122 Z" fill="#9A694B" opacity="0.25" />

  <!-- Smile / Expression -->
  <path d="M110 123 Q120 131 130 123" stroke="#9A3412" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M113 123 Q120 127 127 123" fill="#FFFFFF" opacity="0.9" />

  <!-- Technical Headset -->
  <path d="M82 100 C75 55, 165 55, 158 100" stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Earpiece Left -->
  <rect x="76" y="93" width="8" height="17" rx="4" fill="#0F172A" />
  <!-- Earpiece Right -->
  <rect x="156" y="93" width="8" height="17" rx="4" fill="#0F172A" />
  <!-- Mic Boom -->
  <path d="M80 106 Q82 129 101 129" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <ellipse cx="103" cy="129" rx="3.5" ry="2.5" fill="#10B981" />
</svg>
